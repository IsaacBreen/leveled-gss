[package]
name = "weighted-gss"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A persistent compressed map from stacks to joinable weights"
authors = ["Isaac Breen <mail@isaacbreen.com>"]
homepage = "https://github.com/IsaacBreen/weighted-gss"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/IsaacBreen/weighted-gss"
documentation = "https://docs.rs/weighted-gss"
keywords = ["gss", "glr", "parser", "weighted", "persistent"]
categories = ["algorithms", "data-structures", "parsing"]
exclude = [".github/**", "python/**", "pyproject.toml", "RELEASING.md"]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
im = "15"
rustc-hash = "1"
smallvec = "1"
pyo3 = { version = "0.29.0", optional = true, features = ["extension-module", "abi3-py38", "generate-import-lib"] }

[dev-dependencies]
pretty_assertions = "1"
rand = "0.8"

[package.metadata.docs.rs]
features = []
