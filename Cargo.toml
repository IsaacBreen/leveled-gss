[package]
name = "weighted-gss"
version = "0.2.1"
edition = "2024"
rust-version = "1.85"
description = "Persistent weighted graph-structured stacks"
authors = ["Isaac Breen <mail@isaacbreen.com>"]
homepage = "https://github.com/IsaacBreen/weighted-gss"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/IsaacBreen/weighted-gss"
documentation = "https://docs.rs/weighted-gss"
keywords = ["gss", "glr", "parser", "weighted", "persistent"]
categories = ["algorithms", "data-structures", "parsing"]
exclude = [
    ".github/**",
    "fuzz/**",
    "python/**",
    "pyproject.toml",
    "RELEASING.md",
    "docs/validation/**",
]

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
rustc-hash = "2"
smallvec = "1"
pyo3 = { version = "0.29.0", optional = true, features = ["extension-module", "abi3-py38", "generate-import-lib"] }

[dev-dependencies]
criterion = "0.7"
proptest = "1.11"
rand = "0.8"

[[bench]]
name = "construction"
harness = false

[[bench]]
name = "operations"
harness = false

[[bench]]
name = "materialization"
harness = false

[[bench]]
name = "unweighted"
harness = false
