name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo test --all-targets
        env:
          STACKVEC: vec
      - run: cargo test --all-targets
        env:
          STACKVEC: arc
      - run: cargo test --doc
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --features python --all-targets -- -D warnings
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  python-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install "maturin>=1.7,<2.0"
      - run: maturin build --release --out dist
      - run: python -m pip install --no-index --find-links dist weighted-gss
      - run: python -m unittest discover -s python/tests -v

  python-versions:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.12", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install "maturin>=1.7,<2.0"
      - run: maturin build --release --out dist
      - run: python -m pip install --no-index --find-links dist weighted-gss
      - run: python -m unittest discover -s python/tests -v

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --dry-run
      - run: python -m pip install "maturin>=1.7,<2.0" twine
      - run: maturin build --release --out dist
      - run: maturin sdist --out dist
      - run: python -m twine check dist/*
      - run: python -m pip install --force-reinstall dist/*.tar.gz
      - run: python -c "import weighted_gss; assert weighted_gss.__version__"
