name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo test --all-targets
        env:
          STACKVEC: vec
      - run: cargo test --all-targets
        env:
          STACKVEC: arc
      - run: cargo test --doc
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --features python --all-targets -- -D warnings
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install "maturin>=1.7,<2.0"
      - run: maturin build --release --out dist
      - run: python -m pip install --no-index --find-links dist leveled-gss==0.1.0
      - run: python -m unittest discover -s python/tests -v
